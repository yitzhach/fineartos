<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!-- Graphite. Near-black and almost featureless, for when the work is loud. -->
  <defs>
    <linearGradient id="gr" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#17181a"/><stop offset="1" stop-color="#0b0c0d"/>
    </linearGradient>
    <radialGradient id="grk" cx="0.5" cy="0.06" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#gr)"/>
  <rect width="1600" height="1000" fill="url(#grk)"/>
  <rect width="1600" height="1000" filter="url(#grn)"/>
</svg>
