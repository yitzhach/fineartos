<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!-- Mist. Pale cool grey, daylight, for the light theme. -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#eef1f3"/><stop offset="0.55" stop-color="#e2e7ea"/><stop offset="1" stop-color="#cbd3d8"/>
    </linearGradient>
    <radialGradient id="ml" cx="0.28" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms" cx="0.86" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#7e8c96" stop-opacity="0.22"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="mn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#m)"/>
  <g filter="url(#mb)" opacity="0.7">
    <path d="M-200 660 C 340 560, 760 660, 1160 540 S 1580 420, 1820 450 L 1820 1100 L -200 1100 Z" fill="#b9c4cc" opacity="0.6"/>
  </g>
  <rect width="1600" height="1000" fill="url(#ml)"/>
  <rect width="1600" height="1000" fill="url(#ms)"/>
  <rect width="1600" height="1000" filter="url(#mn)"/>
</svg>
