<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!-- Sandstone. Warm mid-tone rock, strata running low and wide. -->
  <defs>
    <linearGradient id="sa" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#6b5b49"/><stop offset="0.5" stop-color="#54473a"/><stop offset="1" stop-color="#332b23"/>
    </linearGradient>
    <radialGradient id="sak" cx="0.78" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#e8c9a0" stop-opacity="0.24"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sav" cx="0.5" cy="0.45" r="0.82">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.46"/>
    </radialGradient>
    <filter id="sab" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="san" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sa)"/>
  <g filter="url(#sab)" opacity="0.55">
    <rect x="-100" y="560" width="1800" height="90" fill="#8a7358" transform="rotate(-4 800 600)"/>
    <rect x="-100" y="700" width="1800" height="130" fill="#2c241d" transform="rotate(-3 800 760)"/>
    <rect x="-100" y="330" width="1800" height="60" fill="#9c8465" opacity="0.5" transform="rotate(-5 800 360)"/>
  </g>
  <rect width="1600" height="1000" fill="url(#sak)"/>
  <rect width="1600" height="1000" fill="url(#sav)"/>
  <rect width="1600" height="1000" filter="url(#san)"/>
</svg>
