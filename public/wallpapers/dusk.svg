<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!-- Dusk. A cool slate sky over a warm low horizon, for working at night.
       Deliberately darkest at the top, where the system bar sits. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161d"/>
      <stop offset="0.5" stop-color="#1e212a"/>
      <stop offset="0.82" stop-color="#2c2a2b"/>
      <stop offset="1" stop-color="#3a2f28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="1" r="0.62">
      <stop offset="0" stop-color="#d08b53" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#8a5c3c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.14" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#93a6c2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig2" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- A soft bank of cloud, low and wide, to give the field some structure. -->
  <g opacity="0.45">
    <ellipse cx="1080" cy="880" rx="900" ry="180" fill="#4a3b30" opacity="0.5"/>
    <ellipse cx="380" cy="640" rx="620" ry="150" fill="#272b36" opacity="0.6"/>
  </g>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#cool)"/>
  <rect width="1600" height="1000" fill="url(#vig2)"/>
  <rect width="1600" height="1000" filter="url(#grain2)"/>
</svg>
