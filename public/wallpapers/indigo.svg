<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!-- Indigo. Deep blue ground with a pale band, after the paintings. -->
  <defs>
    <linearGradient id="i" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#1b2430"/><stop offset="0.5" stop-color="#141c27"/><stop offset="1" stop-color="#0d1218"/>
    </linearGradient>
    <linearGradient id="ib" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#8fa3b8" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#b9c6d2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4a5a6c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iv" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.48"/>
    </radialGradient>
    <filter id="ibl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="inz" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#i)"/>
  <g filter="url(#ibl)">
    <rect x="-100" y="430" width="1800" height="210" fill="url(#ib)" transform="rotate(-3 800 520)"/>
  </g>
  <rect width="1600" height="1000" fill="url(#iv)"/>
  <rect width="1600" height="1000" filter="url(#inz)"/>
</svg>
