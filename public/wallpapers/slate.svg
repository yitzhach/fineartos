<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!-- Slate. Cool grey stone, light from high left, a quiet horizon band. -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#2b2f34"/><stop offset="0.55" stop-color="#20242a"/><stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <radialGradient id="sk" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#aebbc8" stop-opacity="0.20"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sv" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="sb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="sn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#s)"/>
  <g filter="url(#sb)" opacity="0.6">
    <path d="M-200 700 C 300 600, 800 680, 1200 560 S 1600 440, 1820 470 L 1820 1100 L -200 1100 Z" fill="#39414a" opacity="0.5"/>
  </g>
  <rect width="1600" height="1000" fill="url(#sk)"/>
  <rect width="1600" height="1000" fill="url(#sv)"/>
  <rect width="1600" height="1000" filter="url(#sn)"/>
</svg>
